name: ShellCheck

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "**.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      # Only errors fail the job for now. The existing scripts still have
      # warnings and style notes, and fixing those can change how scripts
      # that ship with Duplicati behave, so they are left for later.
      - name: Check shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error
